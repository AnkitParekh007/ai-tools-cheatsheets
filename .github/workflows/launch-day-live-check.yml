name: launch-day-live-check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live Pages serves launch commit
        shell: bash
        env:
          PAGE_URL: https://ankitparekh007.github.io/ai-tools-cheatsheets/
          EXPECTED_SHA: 0bb1fc1fb5b08b9531fc4f0e35944d46e369f111
        run: |
          set -euo pipefail
          echo "Checking ${PAGE_URL} for launch marker ${EXPECTED_SHA}"
          marker="name=\"ai-build-sha\" content=\"${EXPECTED_SHA}\""
          for attempt in 1 2 3 4 5 6; do
            html="$(curl --fail --silent --show-error --location --max-time 20 "${PAGE_URL}" || true)"
            if grep -Fq "$marker" <<< "$html"; then
              echo "Live GitHub Pages is serving the launch commit."
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "Live GitHub Pages is not serving ${EXPECTED_SHA}." >&2
              exit 1
            fi
            echo "Attempt ${attempt}/6 did not see the expected launch marker."
            sleep 10
          done

      - name: Capture public repository launch metrics
        shell: bash
        env:
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth_header="Authorization: Bearer ${GH_TOKEN}"
          api_header="Accept: application/vnd.github+json"
          version_header="X-GitHub-Api-Version: 2022-11-28"

          curl --fail --silent --show-error --location \
            -H "$auth_header" -H "$api_header" -H "$version_header" \
            "${API_URL}/repos/${REPOSITORY}" > repo.json

          curl --fail --silent --show-error --location \
            -H "$auth_header" -H "$api_header" -H "$version_header" \
            "${API_URL}/repos/${REPOSITORY}/contributors?per_page=100&anon=1" > contributors.json

          curl --fail --silent --show-error --location \
            -H "$auth_header" -H "$api_header" -H "$version_header" \
            "${API_URL}/repos/${REPOSITORY}/releases?per_page=20" > releases.json

          node <<'NODE'
          const fs = require('fs');
          const repo = JSON.parse(fs.readFileSync('repo.json', 'utf8'));
          const contributors = JSON.parse(fs.readFileSync('contributors.json', 'utf8'));
          const releases = JSON.parse(fs.readFileSync('releases.json', 'utf8'));

          console.log(`LAUNCH_METRIC stars=${repo.stargazers_count}`);
          console.log(`LAUNCH_METRIC forks=${repo.forks_count}`);
          console.log(`LAUNCH_METRIC contributors_returned=${contributors.length}`);
          console.log(`LAUNCH_METRIC watchers=${repo.subscribers_count}`);
          console.log(`LAUNCH_METADATA description=${JSON.stringify(repo.description || '')}`);
          console.log(`LAUNCH_METADATA homepage=${JSON.stringify(repo.homepage || '')}`);
          console.log(`LAUNCH_METADATA topics=${JSON.stringify(repo.topics || [])}`);
          console.log(`LAUNCH_RELEASES count=${releases.length}`);
          for (const release of releases) {
            console.log(`LAUNCH_RELEASE tag=${JSON.stringify(release.tag_name)} name=${JSON.stringify(release.name || '')} draft=${release.draft} prerelease=${release.prerelease}`);
          }
          NODE
