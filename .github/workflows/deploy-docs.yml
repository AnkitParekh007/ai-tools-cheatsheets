name: Deploy HonKit Docs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build HonKit Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate and build docs
        run: npm run docs:validate

      - name: Add nojekyll
        run: touch _book/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _book

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed commit freshness
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Verifying ${PAGE_URL} contains build marker ${EXPECTED_SHA}"
          marker="name=\"ai-build-sha\" content=\"${EXPECTED_SHA}\""
          for attempt in 1 2 3 4 5 6; do
            html="$(curl --fail --silent --show-error --location --max-time 20 "${PAGE_URL}" || true)"
            if grep -Fq "$marker" <<< "$html"; then
              echo "GitHub Pages is serving the expected commit."
              exit 0
            fi
            echo "Attempt ${attempt}/6 did not see the expected commit marker yet."
            sleep 10
          done
          echo "GitHub Pages deployment completed, but the public site is not serving ${EXPECTED_SHA}." >&2
          exit 1
